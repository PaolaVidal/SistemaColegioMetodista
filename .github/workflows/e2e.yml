name: E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start backend services
        run: docker compose -f docker-compose.ci.yml up -d postgres backend

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/frontend.log" 2>&1 &

      - name: Wait for services
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000 >/dev/null && \
              curl --fail --silent http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/frontend.log"
          docker compose -f docker-compose.ci.yml logs
          exit 1

      - name: Run Playwright
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            ${{ runner.temp }}/frontend.log
          if-no-files-found: ignore

      - name: Stop backend services
        if: always()
        run: docker compose -f docker-compose.ci.yml down --volumes --remove-orphans
