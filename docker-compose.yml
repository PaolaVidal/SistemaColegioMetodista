services:
  postgres:
    image: postgres:16-alpine
    container_name: cma_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ColegioMetodistaDB
      POSTGRES_USER: cma_user
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cma_user -d ColegioMetodistaDB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - cma_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cma_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ColegioMetodistaDB
      DB_USERNAME: cma_user
      DB_PASSWORD: password123
      N8N_PAYMENT_WEBHOOK_URL: http://n8n:5678/webhook/pago-registrado
      N8N_ACADEMIC_WEBHOOK_URL: http://n8n:5678/webhook/bajo-rendimiento
      N8N_OVERDUE_WEBHOOK_URL: http://n8n:5678/webhook/aviso-mora
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
    command: php artisan serve --no-reload --host=0.0.0.0 --port=8000
    networks:
      - cma_network

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cma_scheduler
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ColegioMetodistaDB
      DB_USERNAME: cma_user
      DB_PASSWORD: password123
      N8N_PAYMENT_WEBHOOK_URL: http://n8n:5678/webhook/pago-registrado
      N8N_ACADEMIC_WEBHOOK_URL: http://n8n:5678/webhook/bajo-rendimiento
      N8N_OVERDUE_WEBHOOK_URL: http://n8n:5678/webhook/aviso-mora
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
    command: php artisan schedule:work
    networks:
      - cma_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cma_worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      n8n:
        condition: service_started
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ColegioMetodistaDB
      DB_USERNAME: cma_user
      DB_PASSWORD: password123
      N8N_PAYMENT_WEBHOOK_URL: http://n8n:5678/webhook/pago-registrado
      N8N_ACADEMIC_WEBHOOK_URL: http://n8n:5678/webhook/bajo-rendimiento
      N8N_OVERDUE_WEBHOOK_URL: http://n8n:5678/webhook/aviso-mora
      CACHE_DRIVER: file
      QUEUE_CONNECTION: database
      SESSION_DRIVER: file
    command: php artisan queue:work database --queue=correos --sleep=2 --tries=3 --timeout=20 --max-time=3600
    networks:
      - cma_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: cma_pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - cma_network

  frontend:
    image: node:20-alpine
    container_name: cma_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0"
    networks:
      - cma_network

  n8n:
    image: n8nio/n8n
    container_name: cma_n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: 5678
      N8N_WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/El_Salvador
      TZ: America/El_Salvador
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    networks:
      - cma_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: cma_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data
    networks:
      - cma_network

volumes:
  postgres_data:
  n8n_data:
  mailpit_data:
  pgadmin_data:

networks:
  cma_network:
    driver: bridge
